<!DOCTYPE html>
<html lang="en" class="transition-colors duration-500">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokéSearch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-black via-purple-900 to-black transition-colors duration-500">

  <div class="absolute top-4 right-4">
    <button id="darkToggle"
      class="px-3 py-2 text-sm sm:text-base bg-gray-900 text-white rounded-lg hover:scale-105 transition">
      Dark Mode
    </button>
  </div>

  <div id="cardContainer"
    class="w-full max-w-md sm:max-w-lg bg-white dark:bg-gray-800 p-5 sm:p-8 rounded-2xl shadow-2xl transition-all duration-500">

    <h1 class="text-2xl sm:text-3xl font-bold text-center mb-5 sm:mb-6 text-gray-800 dark:text-white">
      PokéSearch
    </h1>

    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <input id="pokemonInput" type="text" placeholder="Enter Pokémon name or ID"
        class="flex-1 p-3 rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-500" />

      <button id="searchBtn"
        class="w-full sm:w-auto bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 hover:scale-105 transition">
        Search
      </button>
    </div>

    <div id="loading" class="hidden flex justify-center mb-4">
      <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-indigo-600"></div>
    </div>

    <div id="pokemonCard" class="text-center"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
